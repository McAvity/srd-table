# kenli F-014 T03: versioned releases to GitHub Pages (docs/deployment.md §9). Only an explicit
# dispatch on main; a tag that exists and is in main; one serialized publication lifecycle.
#   publish     build the tag fresh, checkpoint the complete site in pages-state, deploy, smoke, receipt
#   retry       the archived bytes of a reserved version again (never a build)
#   resolve     settle a pending version from the real live site (abandoned / observed-unverified)
#   initialize  the first, empty pages-state commit (then the operator sets PAGES_STATE_ANCHOR)
# Actions are pinned to full commit SHAs (checked against their upstream tags, T03 ledger).
name: pages-release
run-name: pages ${{ inputs.mode }} ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: publish | retry | resolve | initialize
        type: choice
        options: [publish, retry, resolve, initialize]
        default: publish
      tag:
        description: An existing tag vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N on main (empty for initialize)
        type: string
        required: false
        default: ""

permissions: {}

# One lifecycle at a time (initialize, publish, retry, resolve, receipt): no cancelling a running
# one. GitHub keeps at most one pending run per group and gives no FIFO order; pages-state's
# compare-and-swap catches whatever this doesn't.
concurrency:
  group: pages-release
  cancel-in-progress: false

env:
  SITE_URL: https://mcavity.github.io/srd-table/
  BASE: /srd-table/
  ENGINE_REPO: McAvity/srd-rules-engine
  NODE_VERSION: 24.15.0
  BUN_VERSION: 1.3.10

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      tag_commit: ${{ steps.resolve.outputs.tag_commit }}
      engine_commit: ${{ steps.resolve.outputs.engine_commit }}
    steps:
      - name: Checkout main (the trusted helpers, all tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tools
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve the inputs (mode, tag → full commit in main, engine pin)
        id: resolve
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bun tools/scripts/ci/pages-ci.ts resolve --mode "$INPUT_MODE" --tag "$INPUT_TAG" --repo-dir tools --main "$GITHUB_SHA"

  build:
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the tag's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag_commit }}
          path: srd-table
          persist-credentials: false
      - name: Checkout the pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ needs.prepare.outputs.engine_commit }}
          path: srd-rules-engine-main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Fresh install, engine build, verify, lint, typecheck, tests, release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash srd-table/scripts/ci/build.sh srd-table --app-version "$VERSION" --out "$RUNNER_TEMP/candidate/release" --report "$RUNNER_TEMP/candidate/release-report.json"
      - name: Stage the SRD next to the release
        run: cp -R srd-rules-engine-main/dist/srd-5.2.1 "$RUNNER_TEMP/candidate/srd"
      - name: Transport the candidate to the state job (this run only; not a durable source)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
          retention-days: 1
          if-no-files-found: error

  state:
    needs: [prepare, build]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.prepare.outputs.mode != 'publish'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      deployments: read
      actions: read
    outputs:
      deploy: ${{ steps.op.outputs.deploy }}
      artifact_sha256: ${{ steps.op.outputs.artifact_sha256 }}
    steps:
      - name: Checkout main (the trusted publisher; no PR or tag code runs here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Receive the candidate
        if: needs.prepare.outputs.mode == 'publish'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - name: pages-state operation (witnesses, checkpoint, export, exact tar, canary)
        id: op
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ needs.prepare.outputs.mode }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_COMMIT: ${{ needs.prepare.outputs.tag_commit }}
          ANCHOR: ${{ vars.PAGES_STATE_ANCHOR }}
        run: bash tools/scripts/ci/state-op.sh
      - name: Upload exactly the checked tar as the Pages artifact
        if: steps.op.outputs.deploy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [prepare, state]
    if: github.ref == 'refs/heads/main' && needs.state.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  receipt:
    needs: [prepare, state, deploy]
    if: github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      deployments: read
      actions: read
    steps:
      - name: Checkout main (the trusted publisher)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: The deployed artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/deployed
      - name: Same bytes as the checkpoint, HTTP smoke with hashes, receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ANCHOR: ${{ vars.PAGES_STATE_ANCHOR }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          ARTIFACT_SHA256: ${{ needs.state.outputs.artifact_sha256 }}
        run: bash tools/scripts/ci/receipt.sh
