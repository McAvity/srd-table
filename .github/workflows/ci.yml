# kenli F-014 T03: read-only CI (docs/deployment.md §9.1). Push and pull_request only (never
# pull_request_target), the default token read-only, no secrets, no publication: a fresh checkout of
# this repository and of the engine at its pin, lockfile installs, the engine build, engine:verify,
# lint, typecheck, Vitest and an unnumbered release build.
name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: srd-table
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: The engine pin
        id: pin
        run: echo "engine_commit=$(bun srd-table/scripts/ci/pages-ci.ts pin --repo-dir srd-table | jq -r .engine_commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: McAvity/srd-rules-engine
          ref: ${{ steps.pin.outputs.engine_commit }}
          path: srd-rules-engine-main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - name: Fresh install, build, checks, tests, release build
        run: bash srd-table/scripts/ci/build.sh srd-table --out "$RUNNER_TEMP/release"
